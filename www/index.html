<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="随时Go">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
<title>随时Go</title>
<style>
:root{
  --bg:#F5F5F7; --bg-grouped:#F2F2F7;
  --card:#FFFFFF; --card-2:#FAFAFC;
  --sep:rgba(60,60,67,.12);
  --text-1:#1D1D1F; --text-2:rgba(60,60,67,.76); --text-3:rgba(60,60,67,.74);
  --accent:#E8890C; --accent-ink:#8A4F00; --accent-soft:rgba(232,137,12,.12);
  --success:#34A853; --danger:#E5484D;
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --card2:#F2F2F7; --line:var(--sep);
  --amber:var(--accent); --tx:var(--text-1); --tx2:var(--text-2); --tx3:var(--text-3);
  --r-card:28px; --r-bar:32px;
  --spring-snappy:cubic-bezier(.34,1.3,.64,1);
  --spring-smooth:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html.is-native{ --sat:max(env(safe-area-inset-top,0px),28px); --sab:max(env(safe-area-inset-bottom,0px),8px); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);overflow:hidden;
  font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
input,select{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;outline:none;min-width:0}
input:focus,select:focus{border-color:rgba(232,137,12,.6)}
select option{background:#FFFFFF;color:#1D1D1F}

/* ===== 玻璃（仅 chrome） ===== */
.glass{position:relative;background:rgba(255,255,255,.62);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 .5px rgba(0,0,0,.06),0 8px 28px rgba(0,0,0,.10)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 50%)}
.glass.on-light{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.7);color:var(--text-1)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass{background:rgba(255,255,255,.94)} }

/* ===== 视图 ===== */
.view{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
#scene{display:none;z-index:10;overflow:hidden}
#scene.open{display:block}
#sceneScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}

/* ===== 首页 ===== */
.home-wrap{padding:calc(var(--sat) + 14px) 16px calc(40px + var(--sab))}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 4px 14px}
.brand{font-size:30px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.brand b{color:var(--accent-ink);font-weight:800}
.brand-sub{font-size:13px;color:var(--tx2);margin-top:6px}
.count-pill{font-size:12px;color:var(--tx2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card)}
.continue{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(232,137,12,.28);border-radius:20px;padding:12px 14px;margin-bottom:14px;transition:transform 280ms var(--spring-snappy)}
.continue:active{transform:scale(.97);transition-duration:120ms;transition-timing-function:var(--ease-out)}
.continue .ci{width:34px;height:34px;border-radius:12px;background:rgba(232,137,12,.14);color:var(--accent-ink);display:grid;place-items:center;font-size:16px;flex:none}
.continue .ct{flex:1;min-width:0}.continue .ct small{display:block;font-size:11.5px;color:var(--tx2)}
.continue .ct b{font-size:15px}.continue .chev{color:var(--accent-ink);font-size:20px}
.scard{position:relative;display:block;height:248px;border-radius:var(--r-card);overflow:hidden;margin-bottom:16px;background:var(--card);
  box-shadow:var(--shadow-card);transition:transform 280ms var(--spring-snappy)}
.scard:active{transform:scale(.97);transition-duration:120ms;transition-timing-function:var(--ease-out)}
.scard .cov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scard .cov.ph{background:radial-gradient(120% 90% at 80% 0%,#FFF3E0 0%,#F2F2F7 55%,#E5E5EA 100%)}
.scard .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 20%),linear-gradient(0deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.25) 35%,rgba(0,0,0,0) 60%)}
.scard .info{position:absolute;left:18px;right:96px;bottom:16px}
.scard h2{font-size:22px;font-weight:800;line-height:1.2;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.scard .meta{font-size:13px;color:rgba(255,255,255,.9);margin:5px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.28);color:#fff}
.ring{position:absolute;right:16px;bottom:18px;width:66px;height:66px}
.ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}
.ph-badge{position:absolute;top:14px;left:14px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(232,137,12,.16);color:var(--accent-ink);border:1px solid rgba(232,137,12,.35)}
.ph-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);font-size:40px;opacity:.35}
.home-foot{text-align:center;font-size:12px;color:var(--tx3);margin-top:8px}

/* ===== 场景 ===== */
.topbar{position:absolute;z-index:20;left:12px;right:12px;top:calc(var(--sat) + 8px);height:52px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 8px;
  transition:transform 260ms var(--spring-smooth),opacity 260ms var(--spring-smooth)}
.topbar .tb-title{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity 220ms var(--ease-out)}
.topbar.solid .tb-title{opacity:1}
.icon-btn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;flex:none;font-size:18px;transition:transform 320ms var(--spring-snappy)}
.icon-btn:active{transform:scale(.9);transition-duration:120ms}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;height:300px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 20%),linear-gradient(0deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.25) 35%,rgba(0,0,0,0) 60%)}
.hero .ht{position:absolute;left:20px;right:20px;bottom:30px;z-index:2;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.status-pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.28);color:#fff;margin-bottom:6px}
.hero h1{font-size:26px;font-weight:800;line-height:1.2}
.hero .hd{font-size:13px;color:rgba(255,255,255,.9);margin-top:4px}
.scene-body{padding:6px 16px calc(120px + var(--sab))}
.pane{display:none}.pane.on{display:block}
.pane.enter{animation:paneIn 220ms var(--ease-out) both}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scene-in .hero .ht,.scene-in .scene-body{animation:sceneIn 300ms var(--spring-snappy) 120ms both}
@keyframes sceneIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px;font-size:15px;font-weight:700}
.sec-h small{position:relative;z-index:2;display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:12px;color:var(--tx2);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-card)}
.p16{padding:16px}
.lead{font-size:14.5px;color:var(--text-1)}
.cityline{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:10px;font-size:13px}
.cityline i{font-style:normal;color:#8A4F00}
.stats{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;background:var(--card2);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:17px;color:var(--accent-ink)}.stat span{font-size:11.5px;color:var(--tx2)}
/* 路线图 */
.routemap{position:relative;border-radius:22px;overflow:hidden;background:#EEF0F4;border:1px solid var(--line)}
.routemap svg{display:block;width:100%;height:auto}
.rm-h{position:absolute;left:14px;top:10px;font-size:12.5px;color:var(--tx2)}
/* 日卡 */
.dcard{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:10px;transition:transform 280ms var(--spring-snappy)}
.dcard:active{transform:scale(.97);transition-duration:120ms}
.dtag{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--accent-ink);background:rgba(232,137,12,.1);border:1px solid rgba(232,137,12,.3)}
.dthumb{flex:none;width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--card2)}
.dmain{flex:1;min-width:0}
.dmain b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmain span{display:block;font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkm{flex:none;font-size:12px;color:var(--tx2);text-align:right}
.chev{color:var(--tx3);font-size:20px;line-height:1}
.tip{padding:14px 16px;margin-bottom:10px}
.tip b{display:block;font-size:15px;margin-bottom:4px}
.tip p{font-size:13.5px;color:var(--tx2)}
/* 行程 */
.daybar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:4px -16px 4px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.dchip{flex:none;min-width:58px;padding:8px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center;transition:transform 280ms var(--spring-snappy),background-color 200ms}
.dchip:active{transform:scale(.94);transition-duration:120ms}
.dchip b{display:block;font-size:14px}.dchip span{font-size:11px;color:var(--tx2)}
.dchip.on{background:rgba(232,137,12,.14);border-color:rgba(232,137,12,.55)}.dchip.on b{color:var(--accent-ink)}
.dayhead{overflow:hidden}
.dayhead img{width:100%;height:170px;object-fit:cover;border-radius:22px 22px 0 0}
.dayhead .dh{padding:14px 16px}
.dayhead h3{font-size:18px}
.dayhead .dsub{font-size:12.5px;color:var(--tx2);margin-top:2px}
.dayhead .hl{font-size:13.5px;margin-top:8px;color:var(--text-1)}
.tl{position:relative;margin-top:14px;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--amber),rgba(232,137,12,.1));border-radius:2px}
.tli{position:relative;margin-bottom:12px;padding:14px 14px 12px}
.tli::before{content:"";position:absolute;left:-20px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2.5px solid var(--amber)}
.tli .tt{font-size:12px;color:var(--accent-ink);font-weight:700}
.tli h4{font-size:15px;margin:2px 0 4px}
.tli p{font-size:13.5px;color:var(--tx2)}
.tli .tip2{margin-top:8px;font-size:12.5px;color:var(--text-1);background:var(--card2);border-radius:12px;padding:8px 10px}
.tli .tip2 b{color:var(--accent-ink)}
.navbtn{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--accent-ink);border:1px solid rgba(232,137,12,.4);border-radius:999px;padding:4px 12px;transition:transform 280ms var(--spring-snappy)}
.navbtn:active{transform:scale(.94);transition-duration:120ms}
.stay{display:flex;align-items:center;gap:12px;padding:14px 16px}
.stay .si{font-size:22px}.stay .sm{flex:1;min-width:0}.stay .sm b{display:block;font-size:14.5px}.stay .sm span{font-size:12.5px;color:var(--tx2)}
.stay .sp{color:var(--accent-ink);font-weight:800}
/* 美食 */
.fgroup{margin-bottom:14px}
.fcity{display:flex;align-items:center;gap:8px;margin:16px 4px 8px;font-weight:800;font-size:16px}
.fcity::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--amber)}
.food{padding:16px}
.food h4{font-size:16px;margin-bottom:6px}
.food p{font-size:13.5px;color:var(--tx2)}
.food .addr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--text-1)}
.food .addr .navbtn{margin:0;flex:none}
/* 清单 */
.clp{padding:16px;margin-top:6px}
.clp .h{display:flex;justify-content:space-between;align-items:baseline}
.clp .h b{font-size:28px;color:var(--accent-ink)}
.bar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#F2A93B,#E8890C);transform-origin:left;transform:scaleX(0);transition:transform 420ms var(--spring-smooth)}
.clg h3{font-size:14px;margin:18px 6px 8px;color:var(--tx2);font-weight:700}
.cli{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.cli:last-child{border-bottom:0}
.cbx{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid rgba(60,60,67,.3);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;transition:transform 280ms var(--spring-snappy)}
.cbx i{font-style:normal;opacity:0;transform:scale(.4);transition:opacity 160ms,transform 280ms var(--spring-snappy)}
.cli.done .cbx{background:var(--amber);border-color:var(--accent-ink)}
.cli.done .cbx i{opacity:1;transform:none}
.cli:active .cbx{transform:scale(.88);transition-duration:120ms}
.cli .cn{flex:1;min-width:0;font-size:14.5px}
.cli.done .cn{color:var(--tx3);text-decoration:line-through}
.cli .cr{font-size:12px;color:var(--tx2);text-align:right;max-width:42%}
.cl-add{display:flex;gap:8px;padding:10px 12px}
.cl-add input{flex:1}
.add-btn{flex:none;display:inline-grid;place-items:center;padding:0 14px;height:42px;border-radius:14px;background:var(--amber);color:#fff;font-weight:800;font-size:14px;cursor:pointer;transition:transform 280ms var(--spring-snappy)}
.add-btn:active{transform:scale(.94);transition-duration:120ms}
/* 工具 */
.trow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);transition:transform 280ms var(--spring-snappy)}
.trow:last-child{border-bottom:0}
.trow:active{transform:scale(.98);transition-duration:120ms}
.tico{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--card2)}
.tmain{flex:1;min-width:0}.tmain b{display:block;font-size:15.5px}.tmain span{font-size:12.5px;color:var(--tx2)}
.badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--tx2);margin-right:6px}
/* 空状态 */
.empty{text-align:center;padding:40px 24px}
.empty .ei{font-size:46px;opacity:.6}
.empty h3{font-size:18px;margin:12px 0 6px}
.empty p{font-size:13.5px;color:var(--tx2)}
.empty .add-btn{margin-top:18px;padding:0 22px}

/* ===== 底部玻璃 Tab ===== */
.tabbar{position:absolute;z-index:20;left:12px;right:12px;bottom:calc(var(--sab) + 12px);height:70px;border-radius:var(--r-bar);display:flex;padding:6px;
  transform-origin:50% 100%;transition:transform 260ms var(--spring-smooth)}
.tabbar.enter{animation:barIn 300ms var(--spring-snappy) 120ms both}
@keyframes barIn{from{transform:translateY(130%)}to{transform:none}}
.tabbar.shrink{transform:scale(.86) translateY(6px)}
.tabbar .cap{position:absolute;top:6px;bottom:6px;left:6px;border-radius:26px;background:rgba(232,137,12,.16);border:1px solid rgba(232,137,12,.35)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tx2);font-size:11.5px;font-weight:600;
  transition:transform 320ms var(--spring-snappy)}
.tab:active{transform:scale(.94);transition-duration:120ms;transition-timing-function:var(--ease-out)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab .lbl{transition:opacity 260ms var(--spring-smooth)}
.tabbar.shrink .lbl{opacity:0}
.tab.on{color:var(--accent)}
.tab .ico.pop{animation:icoPop 320ms var(--spring-snappy)}
@keyframes icoPop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ===== 二级页（工具） ===== */
.sub{position:absolute;inset:0;z-index:30;background:var(--bg);display:none;overflow:hidden}
.sub.open{display:block}
.sub .sub-scroll{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--sat) + 76px) 16px calc(40px + var(--sab))}
.sub .topbar .tb-title{opacity:1}
.sub.push{animation:pushIn 360ms var(--spring-smooth) both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
.sub.pop{animation:pushOut 300ms var(--spring-smooth) both}
@keyframes pushOut{from{transform:none}to{transform:translateX(100%)}}
.hint{font-size:12.5px;color:var(--tx2);margin:8px 4px}
.foot{text-align:center;font-size:12px;color:var(--tx3);margin:16px 0}
/* 账本 */
.budget-summary{padding:20px;border-radius:22px;background:linear-gradient(135deg,#FFF3E0,#FFFFFF 70%);border:1px solid rgba(232,137,12,.25)}
.bs-lab{font-size:13px;color:var(--tx2)}.bs-num{font-size:34px;font-weight:800;color:var(--accent-ink)}.bs-num small{font-size:18px}
.record-btn{margin:12px 0;text-align:center;padding:13px;border-radius:999px;background:var(--amber);color:#fff;font-weight:800;transition:transform 280ms var(--spring-snappy)}
.record-btn:active{transform:scale(.97);transition-duration:120ms}
.group-label{font-size:13px;color:var(--tx2);margin:14px 6px 8px}
.glist{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow-main{flex:1;min-width:0}.grow-title{font-size:15px;font-weight:600}.grow-sub{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow-right{display:flex;align-items:center;gap:8px;flex:none}
.cat-amt{color:var(--accent-ink)}
.cat-bar{height:5px;border-radius:4px;background:var(--card2);margin-top:8px;overflow:hidden}.cat-bar i{display:block;height:100%;background:var(--amber);transform-origin:left}
.day-tag{font-size:11.5px;font-weight:800;color:var(--accent-ink);margin-right:6px}
.nbtn{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card2);white-space:nowrap}
.nbtn.pri{border-color:rgba(232,137,12,.5);color:var(--accent-ink)}
#navList .grow{flex-wrap:wrap}
#routeMap{height:320px;border-radius:22px;overflow:hidden;background:#EEF0F4}
.overview-legs{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.overview-legs::-webkit-scrollbar{display:none}

}

.ai-lab{font-size:13px;color:var(--text-2);margin:6px 2px 0}
.ai-form input,.ai-keycard input{width:100%;background:#F2F2F7;border:1px solid var(--sep);color:var(--text-1)}
.ai-days{display:flex;flex-wrap:wrap;gap:8px}
.ai-day{min-width:56px;height:44px;border-radius:14px;background:#F2F2F7;border:1px solid transparent;font-weight:600;color:var(--text-1)}
.ai-day.on{background:var(--accent-soft);border-color:rgba(232,137,12,.45);color:var(--accent-ink)}
.ai-warn{font-size:13px;color:#8A4F00;background:#FFF3E0;border-radius:12px;padding:10px 12px}.ai-warn a{text-decoration:underline;font-weight:700;cursor:pointer}
.ai-gen{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 8px 10px;text-align:center}
.ai-spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(232,137,12,.18);border-top-color:#E8890C;animation:aispin 900ms linear infinite}
@keyframes aispin{to{transform:rotate(360deg)}}
.ai-step{font-size:15px;font-weight:600;color:var(--text-1)}
.ai-fail{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 6px 4px}
.ai-fail-ic{width:46px;height:46px;border-radius:50%;background:#FDECEC;color:#B42318;font-weight:800;font-size:24px;display:grid;place-items:center}
.ai-fail-msg{font-size:15px;font-weight:600;color:var(--text-1)}
.ai-fail .record-btn{align-self:stretch}
.ai-keyrow{display:flex;align-items:center;gap:8px;margin-top:10px}.ai-keystate{font-size:12.5px;color:var(--text-2);margin-left:auto}
.add-btn.ghost{background:#F2F2F7!important;border-color:transparent!important;color:var(--text-1)!important}
.gcap{position:absolute;left:6px;top:6px;height:50px;border-radius:25px;background:rgba(0,0,0,.05);pointer-events:none;z-index:0;transition:transform 320ms cubic-bezier(.32,.72,0,1)}
.gtab.on{background:transparent!important}
</style>

<script src="./vendor/leaflet/leaflet.js"></script>
<script>
try{ if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()) document.documentElement.classList.add('is-native'); }catch(e){}
const $=id=>document.getElementById(id);
const store={
  get(k,d){ try{ const v=localStorage.getItem('qg_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('qg_'+k,JSON.stringify(v)); }catch(e){} }
};
function esc(s){ return String(s==null?'':s).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]\s?/gu,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let toastTimer;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const img1x=p=>p?p.replace(/\.png$/,'@1x.webp'):'';
const img2x=p=>p?p.replace(/\.png$/,'@2x.webp'):'';
const FB_IMG='images/fallback.png';
function imgFb(el){ if(!el||el.dataset.fb) return; el.dataset.fb='1'; el.removeAttribute('srcset'); el.src=img1x(FB_IMG); el.srcset=img1x(FB_IMG)+' 1x, '+img2x(FB_IMG)+' 2x'; }
document.addEventListener('error',e=>{ const t=e.target; if(t&&t.tagName==='IMG'&&!t.closest('.leaflet-container')) imgFb(t); },true);
window.IMG_FOCUS=window.IMG_FOCUS||{};
const fstyle=p=>IMG_FOCUS[p]?` style="object-position:${IMG_FOCUS[p]}"`:'';
const srcset=p=>{ p=p||FB_IMG; return `${fstyle(p)} src="${img1x(p)}" srcset="${img1x(p)} 1x, ${img2x(p)} 2x" onerror="imgFb(this)"`; };

const LI={cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',pin:'<path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',play:'<path d="M8 5l11 7-11 7z"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',swap:'<path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',temp:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>',car:'<path d="M5 17h14M4 17v-4l2-5h12l2 5v4M7 17v2M17 17v2"/><circle cx="7.5" cy="13.5" r="1"/><circle cx="16.5" cy="13.5" r="1"/>',bed:'<path d="M3 18V7M3 13h18v5M21 13a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="10.5" r="1.5"/>',map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',plane:'<path d="M10 14 3 12l1-2 7 1 4-6h2l-2 7 5 1 1 2-6 1-3 5h-2l1-5"/>',train:'<rect x="6" y="3" width="12" height="13" rx="3"/><path d="M6 10h12M9 20l-2 2M15 20l2 2M9 13h.01M15 13h.01"/>',ticket:'<path d="M3 8a2 2 0 0 0 0 4v4h18v-4a2 2 0 0 1 0-4V4H3z"/><path d="M13 4v12"/>',bowl:'<path d="M3 11h18a9 9 0 0 1-18 0zM7 20h10"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',cloud:'<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/>',rain:'<path d="M7 15h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 15zM8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',snow:'<path d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 14zM8 18h.01M12 20h.01M16 18h.01"/>',fog:'<path d="M4 9h16M3 13h18M5 17h14"/>',storm:'<path d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 14zM12 15l-2 4h4l-2 4"/>',mount:'<path d="M3 20 10 8l4 6 2-3 5 9z"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'};
const ico=n=>`<svg class="li" viewBox="0 0 24 24" aria-hidden="true">${LI[n]||''}</svg>`;
const noEmo=t=>String(t==null?'':t).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'').replace(/^\s+/,'');
const exPlace=()=>{ const p=(typeof ROUTE_POINTS!=='undefined'&&ROUTE_POINTS[1])||null; return p?p.name:'景区'; };
const amapSearch=k=>`https://uri.amap.com/search?keyword=${encodeURIComponent(k)}&src=suishigo&callnative=1`;
function openExternal(url){ window.open(url,'_blank','noopener'); }
function withWillChange(el,ms){ el.style.willChange='transform'; clearTimeout(el._wc); el._wc=setTimeout(()=>{el.style.willChange='';},ms+60); }

/* ---------- 弹簧：stiffness 300, damping 26 → 预计算 linear() ---------- */
const SPRING=(function(){ const k=300,c=26,m=1,dt=1/600; let x=0,v=0,pts=[]; const T=0.32; for(let t=0,i=0;t<=T+1e-9;t+=dt,i++){ const a=(-k*(x-1)-c*v)/m; v+=a*dt; x+=v*dt; if(i%12===0) pts.push(+x.toFixed(4)); } pts[pts.length-1]=1; return pts; })();
const LINEAR_OK=(()=>{ try{ return CSS.supports('transition-timing-function','linear(0, 1)'); }catch(e){ return false; } })();
const SPRING_EASE=LINEAR_OK?`linear(0, ${SPRING.join(', ')})`:'cubic-bezier(.34,1.3,.64,1)';

/* ---------- 数据 ---------- */
let INDEX=[], SCENE=null, SCENE_META=null;
const TIPS=[
  ['🎫 必须提前预约','莫高窟正常票（8窟+数字电影）需在「莫高窟参观预约网」抢，旺季提前 7-15 天；抢不到可买 B 类应急票（4窟）。茶卡盐湖、七彩丹霞可现场购票。'],
  ['🚗 交通建议','环线公共交通不便，推荐西宁包车 / 拼车（4人拼车人均约 ¥500-700/天）或自驾租车（SUV 约 ¥300-400/天）。单日车程最长 500km+。'],
  ['🎒 高原与沙漠装备','9月底青海湖海拔 3200m，早晚仅 3-8℃，羽绒服必带；敦煌白天 25℃+ 紫外线极强，防晒霜+墨镜+魔术头巾；盐湖下水备拖鞋和防水手机袋。'],
  ['🌡️ 一天过四季','青海湖清晨看日出要穿冬装，中午茶卡盐湖短袖即可，夜晚敦煌沙漠星空又要加外套。行李按"洋葱式穿法"打包。']
];
const OVERVIEW_TEXT={'qinggan-loop':'7天6晚 · 青甘大环线自驾路线，湖泊、盐湖、戈壁、石窟与丹霞一次串联。'};
const SCENE_CACHE={};
async function loadJSON(u){ const r=await fetch(u); if(!r.ok) throw new Error(u); return r.json(); }

/* 清单存储：青甘沿用 v2 的 qg_cl 键，保证覆盖安装后勾选不丢 */
const clKey=id=>id==='qinggan-loop'?'cl':'cl_'+id;
function getChecklist(id,def){ return store.get(clKey(id),null) || JSON.parse(JSON.stringify(def||[])); }
function clProgress(list){ let t=0,d=0; (list||[]).forEach(g=>g.items.forEach(i=>{t++; if(i.done)d++;})); return {t,d,p:t?Math.round(d*100/t):0}; }

/* ---------- 首页 ---------- */
function ringSVG(p){ const r=28,C=2*Math.PI*r; return `<svg viewBox="0 0 66 66"><circle cx="33" cy="33" r="${r}" fill="rgba(0,0,0,.28)" stroke="rgba(255,255,255,.3)" stroke-width="5"/><circle cx="33" cy="33" r="${r}" fill="none" stroke="#E8890C" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p/100)).toFixed(1)}"/></svg><div class="rt">${p}%</div>`; }
function renderHome(){
  $('sceneCount').textContent=INDEX.length+' 个场景';
  $('sceneList').innerHTML=INDEX.map((s,i)=>{

function flip(fromEl,toEl,reverse,done){
  const hero=$('sceneHero');
  if(!fromEl||REDUCED){ const sc=$('scene'); sc.animate([{opacity:reverse?1:0},{opacity:reverse?0:1}],{duration:150,fill:'none'}).onfinish=()=>done&&done(); return; }
  const a=fromEl.getBoundingClientRect(), b=hero.getBoundingClientRect();
  const sx=a.width/b.width, sy=a.height/b.height, tx=a.left-b.left, ty=a.top-b.top;
  const cardT=`translate(${tx}px,${ty}px) scale(${sx},${sy})`, full='translate(0,0) scale(1,1)';
  const sc=$('scene'), body=$('sceneBody');
  hero.style.transformOrigin='0 0'; withWillChange(hero,reverse?360:420);
  const dur=reverse?360:420, ease='cubic-bezier(.32,.72,0,1)';
  const h=hero.animate([{transform:reverse?full:cardT,borderRadius:'0px'},{transform:reverse?cardT:full}],{duration:dur,easing:ease});
  /* 场景底色淡入淡出，只动 opacity */
  sc.style.background='transparent';
  const bgLayer=sc._bg||(sc._bg=Object.assign(document.createElement('div'),{style:'position:absolute;inset:0;background:#F5F5F7;z-index:-1;pointer-events:none'}));
  if(!bgLayer.parentNode) sc.prepend(bgLayer);
  bgLayer.animate([{opacity:reverse?1:0},{opacity:reverse?0:1}],{duration:dur,easing:ease,fill:'forwards'});
  if(reverse){ body.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'}); $('tabbar').animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'}); $('sceneTop').animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'}); hero.querySelector('.ht').animate([{opacity:1},{opacity:0}],{duration:140,fill:'forwards'}); }
  h.onfinish=()=>{ hero.style.transformOrigin=''; sc.style.background=''; if(done) done(); if(!reverse) bgLayer.getAnimations().forEach(x=>x.cancel()); };
}

function routeSVG(){
  const pts=ROUTE_POINTS, W=380, H=230, pad=40;
  const lats=pts.map(p=>p.pos[0]), lngs=pts.map(p=>p.pos[1]);
  const minLa=Math.min(...lats), maxLa=Math.max(...lats), minLo=Math.min(...lngs), maxLo=Math.max(...lngs);
  const k=Math.min((W-pad*2)/(maxLo-minLo),(H-pad*2-14)/(maxLa-minLa));
  const ox=(W-(maxLo-minLo)*k)/2, oy=(H-(maxLa-minLa)*k)/2+10;
  const P=p=>[ox+(p.pos[1]-minLo)*k, oy+(maxLa-p.pos[0])*k];
  const xy=pts.map(P);
  let d=`M${xy[0][0].toFixed(1)},${xy[0][1].toFixed(1)}`;
  for(let i=1;i<xy.length;i++){ const [x0,y0]=xy[i-1],[x1,y1]=xy[i]; const mx=(x0+x1)/2, my=(y0+y1)/2-8; d+=` Q${mx.toFixed(1)},${my.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`; }
  const seen={}; let labels='', dots='', boxes=xy.map(([x,y])=>[x-10,y-10,x+10,y+10]);
  const hit=(b,i)=>b[0]<4||b[2]>W-4||b[1]<4||b[3]>H-4||boxes.some((o,j)=>j!==i&&!(b[2]<o[0]||b[0]>o[2]||b[3]<o[1]||b[1]>o[3]));
  pts.forEach((p,i)=>{ const [x,y]=xy[i]; const key=p.pos.join(); const dup=seen[key]; seen[key]=1;
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#FFFFFF" stroke="#E8890C" stroke-width="2.4"/>`;
    if(dup) return;
    const w=p.name.length*10.5+4, h=24; const cands=[[x-w/2,y-8-h,'middle',x],[x-w/2,y+8,'middle',x],[x-10-w,y-h/2,'end',x-10],[x+10,y-h/2,'start',x+10],[x+10,y-h-2,'start',x+10],[x+10,y+2,'start',x+10],[x-10-w,y-h-2,'end',x-10],[x-10-w,y+2,'end',x-10]];
    let c=cands.find(c=>!hit([c[0],c[1],c[0]+w,c[1]+h],i))||cands[0]; boxes.push([c[0],c[1],c[0]+w,c[1]+h]);
    labels+=`<text x="${c[3].toFixed(1)}" y="${(c[1]+11).toFixed(1)}" text-anchor="${c[2]}" font-size="10.5" font-weight="700" fill="#1D1D1F">${esc(p.name)}</text><text x="${c[3].toFixed(1)}" y="${(c[1]+22).toFixed(1)}" text-anchor="${c[2]}" font-size="9" font-weight="700" fill="#8A4F00">${esc(p.time.split(' ')[0])}</text>`; });
  labels=dots+labels;
  let grid=''; for(let gx=0;gx<=W;gx+=38) grid+=`<path d="M${gx} 0V${H}"/>`; for(let gy=0;gy<=H;gy+=38) grid+=`<path d="M0 ${gy}H${W}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="rg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF0F4"/></radialGradient></defs><rect width="${W}" height="${H}" fill="url(#rg)"/><g stroke="rgba(60,60,67,.08)" stroke-width="1">${grid}</g><path d="${d}" fill="none" stroke="rgba(232,137,12,.22)" stroke-width="8" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#E8890C" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round"/>${labels}</svg>`;
}

    const text=(result.data.text||'').replace(/\s+/g,' ').trim();

function validateScene(o,days){ const err=[]; const S=v=>typeof v==='string'&&v.trim().length>0; const A=v=>Array.isArray(v)&&v.length>0;

    o.days.forEach((d,i)=>{ if(!d||!S(d.route)) err.push(`days[${i}].route`); if(!A(d&&d.items)) err.push(`days[${i}].items`); else d.items.forEach((it,j)=>{ if(!it||!S(it.ti)) err.push(`days[${i}].items[${j}].ti`); }); }); }
  if(!Array.isArray(o.routePoints)||o.routePoints.length<2) err.push('routePoints'); else o.routePoints.forEach((p,i)=>{ if(!p||!S(p.name)||!Array.isArray(p.pos)||p.pos.length!==2||!p.pos.every(n=>typeof n==='number'&&isFinite(n))) err.push(`routePoints[${i}]`); else { const [a,b]=p.pos; const lng=Math.max(a,b), lat=Math.min(a,b); if(lng<70||lng>140||lat<15||lat>55) err.push(`routePoints[${i}].pos 超出范围`); } });
  if(!A(o.food)) err.push('food'); else o.food.forEach((g,i)=>{ if(!g||!A(g.items)) err.push(`food[${i}].items`); else g.items.forEach((f,j)=>{ if(!f||!S(f.name)) err.push(`food[${i}].items[${j}].name`); }); });
  if(!A(o.checklist)) err.push('checklist'); else o.checklist.forEach((g,i)=>{ if(!g||!S(g.t)||!A(g.items)) err.push(`checklist[${i}]`); else g.items.forEach((c,j)=>{ if(!c||!S(c.n)) err.push(`checklist[${i}].items[${j}].n`); }); });

async function commonsSearch(q,used){

    const list=Object.values(pages).sort((a,b)=>(a.index||0)-(b.index||0));
    for(const p of list){ const ii=p.imageinfo&&p.imageinfo[0]; if(!ii) continue; if(!/jpeg|png|webp/.test(ii.mime||'')) continue;
      if(ii.width>=1440&&ii.width>ii.height*1.2&&ii.thumburl&&!used.has(ii.thumburl)){ used.add(ii.thumburl); return {url:ii.thumburl,title:p.title,page:ii.descriptionurl||''}; } }
  }catch(e){} return null; }

  for(let i=0;i<o.days.length;i++){ const d=o.days[i]; onStep&&onStep(`搜索 ${d.d} 配图…`);
    const q=(d.cap||'').split('·')[0].trim()||d.route.split('→').pop().trim(); const im=await commonsSearch(q,used)||await commonsSearch(dest+' '+q,used);
    if(im){ d.img=await cacheImage(im.url,id+'-'+d.d); credits.push(d.d+'：'+im.title.replace(/^File:/,'')+' — Wikimedia Commons '+im.page); } else d.img=gradCover(dest+d.d); }
  o.imgCredits=credits; return o; }

/* AI 场景登记 */
let AI_INDEX=[];
async function aiLoadIndex(){ AI_INDEX=(await AI.readJSON('index.json'))||[]; return AI_INDEX; }
async function aiSaveIndex(){ await AI.fsWrite('index.json',JSON.stringify(AI_INDEX)); }
function aiMeta(o,dest,days,id,cover){ const cities=[...new Set(o.routePoints.map(p=>p.name))].slice(0,6);
  return {id,title:o.title||dest,days:`${days}天${Math.max(0,days-1)}晚`,cities,cover:cover||gradCover(o.title||dest),status:'ready',file:'ai:'+id,source:'ai',dest,nDays:days,updated:Date.now()}; }
async function mergeAIIndex(){ await aiLoadIndex(); const ov=(await AI.readJSON('overrides.json'))||{};
  AI_INDEX.forEach(m=>{ if(!INDEX.some(x=>x.id===m.id)) INDEX.push(m); });
  INDEX.forEach(m=>{ if(ov[m.id]){ m._override=true; if(ov[m.id].cover) m.cover=ov[m.id].cover; } }); }
async function loadSceneData(meta){
  if(meta._override||meta.source==='ai'){ const o=await AI.readJSON('scenes/'+meta.id+'.json'); if(o) return o; if(meta.source==='ai') throw new Error('本地场景文件缺失'); }
  return loadJSON('data/scenes/'+meta.file); }

/* 生成主流程：校验不过自动重试 1 次；全部通过才写入；旧版保留为 .prev */
let AI_BUSY=false;
async function aiGenerate(dest,days,existingId,onStep){
  const key=await AI.getKey(); if(!key) throw Object.assign(new Error('还没有填写 DeepSeek Key'),{nokey:true});
  let o=null, lastErr=null;
  for(let attempt=1;attempt<=2;attempt++){
    onStep&&onStep(attempt===1?'正在生成攻略（约 20-60 秒）…':'结构校验未通过，自动重试…');
    try{ const raw=await aiCallDeepSeek(key,dest,days); const errs=validateScene(raw,days);
      if(!errs.length){ o=raw; break; } lastErr=new Error('结构校验未通过：'+errs.slice(0,3).join('；')); }
    catch(e){ if(e.name==='AbortError') throw new Error('请求超时（60 秒），请检查网络后重试'); if(!e.invalid){ if(/Failed to fetch|NetworkError|network|Load failed/i.test(e.message||'')) throw new Error('网络连接失败，请检查网络后重试'); throw e; } lastErr=e; }
  }
  if(!o) throw lastErr||new Error('生成失败');
  const id=existingId||('ai-'+Date.now().toString(36));
  o=aiNormalize(o,id,dest); await aiImages(o,dest,id,onStep);
  onStep&&onStep('保存到本机…');
  const prev=await AI.fsRead('scenes/'+id+'.json'); const builtin=INDEX.find(x=>x.id===id&&x.source!=='ai');
  if(prev) await AI.fsWrite('scenes/'+id+'.prev.json',prev);
  else if(builtin&&SCENE_CACHE[id]) await AI.fsWrite('scenes/'+id+'.prev.json',JSON.stringify(SCENE_CACHE[id]));
  await AI.fsWrite('scenes/'+id+'.json',JSON.stringify(o));
  if(builtin){ const ov=(await AI.readJSON('overrides.json'))||{}; ov[id]={cover:o._cover||null,at:Date.now()}; await AI.fsWrite('overrides.json',JSON.stringify(ov)); builtin._override=true; if(o._cover) builtin.cover=o._cover; }
  else { const m=aiMeta(o,dest,days,id,o._cover); const i=AI_INDEX.findIndex(x=>x.id===id); if(i>=0){ m.prevMeta=AI_INDEX[i]; AI_INDEX[i]=m; } else AI_INDEX.push(m); await aiSaveIndex();
    const j=INDEX.findIndex(x=>x.id===id); if(j>=0) INDEX[j]=m; else INDEX.push(m); }
  SCENE_CACHE[id]=o; return id; }

/* ---------- UI ---------- */
function aiModal(html){ $('modalCard').innerHTML=html; $('modalMask').classList.add('show'); document.body.classList.add('modal-open'); }
async function openAddScene(prefill){ const key=await AI.getKey();
  aiModal(`<div class="modal-head"><h3>添加场景</h3><div class="modal-x" onclick="closeModal()">✕</div></div>
    <div class="ai-form" id="aiForm">
      <label class="ai-lab">目的地</label><input id="aiDest" placeholder="如：桂林阳朔、甘南、喀什" value="${esc(prefill&&prefill.dest||'')}" autocomplete="off">
      <label class="ai-lab">天数</label><div class="ai-days">${[3,4,5,6,7,8].map(n=>`<button class="ai-day ${n===(prefill&&prefill.days||5)?'on':''}" data-n="${n}" onclick="aiPickDays(this)">${n} 天</button>`).join('')}</div>
      ${key?'':'<div class="ai-warn">还没有填写 DeepSeek Key，<a onclick="closeModal();gnavGo(\'me\')">去「我的」设置</a></div>'}
      <div class="record-btn" id="aiGo" onclick="aiStart()">生成攻略</div>
      <div class="hint">由 DeepSeek 生成，日期、价格、电话不会自动填写；配图来自 Wikimedia Commons，搜不到时用渐变占位图。生成后保存在本机，没网也能看。</div>
    </div>`); }
function aiPickDays(b){ document.querySelectorAll('.ai-day').forEach(x=>x.classList.toggle('on',x===b)); }
function aiGenView(dest,step){ return `<div class="modal-head"><h3>正在生成「${esc(dest)}」</h3></div>
  <div class="ai-gen"><div class="ai-spin" aria-hidden="true"></div><div class="ai-step" id="aiStep">${esc(step||'准备中…')}</div><div class="hint">请保持 App 打开，超时 60 秒算失败，已有内容不受影响。</div></div>`; }
function aiFailView(dest,msg,retryJs,nokey){ return `<div class="modal-head"><h3>生成失败</h3><div class="modal-x" onclick="closeModal()">✕</div></div>
  <div class="ai-fail"><div class="ai-fail-ic">!</div><p class="ai-fail-msg">${esc(msg)}</p><p class="hint">「${esc(dest)}」${nokey?'需要先填写 Key。':'没有入库，已有内容保持不变。'}</p>
  ${nokey?`<div class="record-btn" onclick="closeModal();gnavGo('me')">去填写 Key</div>`:`<div class="record-btn" id="aiRetry" onclick="${retryJs}">重试</div>`}</div>`; }
async function aiRun(dest,days,existingId){ if(AI_BUSY) return; AI_BUSY=true; window._backT=0;
  const job=JSON.stringify([dest,days,existingId||null]).replace(/"/g,'&quot;');
  aiModal(aiGenView(dest));
  try{ const id=await aiGenerate(dest,days,existingId,s=>{ const el=$('aiStep'); if(el) el.textContent=s; });
    AI_BUSY=false; closeModal(); renderHome();
    const i=INDEX.findIndex(x=>x.id===id); toast(existingId?'已更新为新版，旧版已保留':'已生成并保存到本机');
    if(existingId&&sceneOpen){ forceCloseScene(); }
    if(i>=0) await openScene(i,null);
  }catch(e){ AI_BUSY=false; aiModal(aiFailView(dest,e.message||'生成失败',`aiRun.apply(null,${job})`,e.nokey)); } }
function aiStart(){ const dest=($('aiDest').value||'').trim(); if(!dest){ toast('先填写目的地'); return; }
  const b=document.querySelector('.ai-day.on'); aiRun(dest,b?+b.dataset.n:5,null); }
function aiRegenerate(){ const m=SCENE_META; if(!m) return; const n=m.nDays||DAYS.length||5;
  aiModal(`<div class="modal-head"><h3>重新生成「${esc(m.title)}」</h3><div class="modal-x" onclick="closeModal()">✕</div></div>
    <p class="hint" style="margin:4px 4px 14px">后台生成新版，校验通过后才替换当前内容；旧版保留一份，可随时回滚。你勾过的清单和记的账不会被覆盖。</p>
    <div class="record-btn" onclick="aiRun(${JSON.stringify(m.dest||m.title).replace(/"/g,'&quot;')},${n},'${m.id}')">开始重新生成</div>`); }
async function aiRollback(){ const m=SCENE_META; if(!m) return; const prev=await AI.fsRead('scenes/'+m.id+'.prev.json'); if(!prev){ toast('没有可回滚的旧版'); return; }
  const cur=await AI.fsRead('scenes/'+m.id+'.json');
  if(m.source==='ai'){ await AI.fsWrite('scenes/'+m.id+'.json',prev); if(cur) await AI.fsWrite('scenes/'+m.id+'.prev.json',cur); const k=AI_INDEX.findIndex(x=>x.id===m.id); if(k>=0&&AI_INDEX[k].prevMeta){ const pm=AI_INDEX[k].prevMeta; pm.prevMeta=Object.assign({},AI_INDEX[k],{prevMeta:undefined}); AI_INDEX[k]=pm; const j=INDEX.findIndex(x=>x.id===m.id); if(j>=0) INDEX[j]=pm; await aiSaveIndex(); } }
  else { // 内置场景：回滚 = 删除覆盖，回到 APK 内置版（当前 AI 版留作 .prev）
    if(cur) await AI.fsWrite('scenes/'+m.id+'.prev.json',cur); await AI.fsDel('scenes/'+m.id+'.json'); const ov=(await AI.readJSON('overrides.json'))||{}; delete ov[m.id]; await AI.fsWrite('overrides.json',JSON.stringify(ov)); m._override=false; }
  delete SCENE_CACHE[m.id]; const i=INDEX.findIndex(x=>x.id===m.id); if(m.source!=='ai'){ try{ SCENE_CACHE[m.id]=await loadJSON('data/scenes/'+INDEX[i].file); }catch(e){} const base=(await loadJSON('data/scenes/index.json')).scenes.find(x=>x.id===m.id); if(base) INDEX[i].cover=base.cover; }
  forceCloseScene(); await openScene(i,null); toast('已回滚到上一版'); }
async function aiDelete(){ const m=SCENE_META; if(!m||m.source!=='ai') return; if(!confirm(`删除「${m.title}」？本机保存的攻略和图片会一起删除。`)) return;
  await AI.fsDel('scenes/'+m.id+'.json'); await AI.fsDel('scenes/'+m.id+'.prev.json'); AI_INDEX=AI_INDEX.filter(x=>x.id!==m.id); await aiSaveIndex();
  const i=INDEX.findIndex(x=>x.id===m.id); if(i>=0) INDEX.splice(i,1); delete SCENE_CACHE[m.id]; forceCloseScene(); updateGnav(); toast('已删除'); }
async function sceneAiActions(){ const m=SCENE_META; if(!m) return; const box=$('aiActions'); if(!box) return;
  const hasPrev=!!(await AI.fsRead('scenes/'+m.id+'.prev.json')); const ai=m.source==='ai';
  box.innerHTML=`<div class="sec-h">AI 攻略</div><div class="card glist">
    ${ai?`<div class="grow"><div class="grow-main"><div class="grow-title">AI 生成的场景</div><div class="grow-sub">${esc(SCENE.source||'')}</div></div></div>`:''}
    <div class="grow" onclick="aiRegenerate()"><div class="grow-main"><div class="grow-title">重新生成攻略</div><div class="grow-sub">校验通过才替换，旧版保留可回滚</div></div><span class="chev">›</span></div>
    ${hasPrev?`<div class="grow" onclick="aiRollback()"><div class="grow-main"><div class="grow-title">回滚到上一版</div><div class="grow-sub">恢复替换前的内容</div></div><span class="chev">›</span></div>`:''}
    ${ai?`<div class="grow" onclick="aiDelete()"><div class="grow-main"><div class="grow-title" style="color:#B42318">删除这个场景</div><div class="grow-sub">内置的 4 个场景不能删除</div></div><span class="chev">›</span></div>`:''}
  </div>${ai&&(SCENE.imgCredits||[]).length?`<div class="card credits">${SCENE.imgCredits.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:''}`; }
async function aiKeyCardHTML(){ const k=await AI.getKey();
  return `<div class="sec-h">AI 生成（DeepSeek）</div><div class="card p16 ai-keycard">
    <label class="ai-lab" for="aiKey">DeepSeek API Key</label>
    <input id="aiKey" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="sk-…（在 platform.deepseek.com 申请）" value="${k?'••••••••'+esc(k.slice(-4)):''}">
    <div class="ai-keyrow"><div class="add-btn" onclick="aiSaveKey()">保存</div>${k?'<div class="add-btn ghost" onclick="aiClearKey()">清除</div>':''}<span class="ai-keystate">${k?'已保存（尾号 '+esc(k.slice(-4))+'）':'未填写'}</span></div>
    <div class="hint">Key 只保存在这台手机上，App 直接请求 DeepSeek，不经过任何第三方服务器。</div></div>`; }
async function aiSaveKey(){ const v=($('aiKey').value||'').trim(); if(!v||v.startsWith('••')){ toast('请粘贴完整的 Key'); return; } if(!/^sk-[A-Za-z0-9_\-]{10,}$/.test(v)){ toast('Key 格式不对，应以 sk- 开头'); return; } await AI.kvSet(AI.KEY,v); toast('Key 已保存到本机'); renderMe(); }
async function aiClearKey(){ await AI.kvSet(AI.KEY,null); toast('已清除 Key'); renderMe(); }

/* ==================== 启动 ==================== */
(async function boot(){
  try{ INDEX=(await loadJSON('data/scenes/index.json')).scenes; INDEX.forEach(x=>{ if(x.cover&&x.focus) IMG_FOCUS[x.cover]=x.focus; }); }catch(e){ INDEX=[]; toast('场景索引加载失败'); }
  try{ await mergeAIIndex(); }catch(e){}
  await Promise.all(INDEX.filter(s=>s.status!=='placeholder').map(async s=>{ try{ SCENE_CACHE[s.id]=await loadSceneData(s); }catch(e){} }));
  renderHome(); updateGnav();
  renderOrders(); renderBudget(); renderWeather(); fxCalc();
  const q=new URLSearchParams(location.search);
  if(q.has('scene')){ const i=INDEX.findIndex(s=>s.id===q.get('scene')); if(i>=0){ await openScene(i,null); if(q.get('tab')) switchTab(q.get('tab'),true); if(q.get('sub')) openSub(q.get('sub')); } }
  if(q.get('view')) gnavGo(q.get('view'));
})();
(function syncStatusBar(){ try{ const SB=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.StatusBar; if(SB) SB.setStyle({style:'LIGHT'}); }catch(e){} })();
if('serviceWorker' in navigator && !window.Capacitor){ addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
</script>
